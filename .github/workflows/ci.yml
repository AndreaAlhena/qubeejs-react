name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ci-${{ github.ref }}

jobs:
  verify:
    name: verify (node ${{ matrix.node }}, react ${{ matrix.react }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['22.12', '24']
        react: ['18', '19']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: ${{ matrix.node }}

      - run: npm ci

      # React Router 8 needs React 19.2 or later, so the React 18 leg tests the entry against
      # React Router 7.
      - name: Switch to React 18
        if: matrix.react == '18'
        run: npm install --no-save react@18.3 react-dom@18.3 @types/react@18 @types/react-dom@18 react-router@7

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Every entry of entries.json: both formats and their types exist and load, the client
      # directive is on the client entries only, each entry imports nothing but react, the core
      # and its own optional peer, and the package has no runtime dependencies.
      - name: Check the built package
        run: npm run check:dist

      # publint checks package.json against what is published; attw checks that every entry's
      # types resolve under node16 and bundler resolution, from ESM and from CommonJS.
      - name: Lint the package
        run: npm run lint:package

  consumer:
    name: consumer (react ${{ matrix.react }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: '24'

      - run: npm ci

      - name: Build
        run: npm run build

      # The package as an app gets it: packed, installed from the tarball into a fresh project
      # outside the repository, type-checked and run as ESM and as CommonJS.
      - name: Test the packed tarball in a fresh project
        env:
          CONSUMER_REACT: ${{ matrix.react }}
        run: npm run test:consumer
