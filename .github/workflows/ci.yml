name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  cancel-in-progress: true
  group: ci-${{ github.ref }}

jobs:
  verify:
    name: verify (node ${{ matrix.node }}, react ${{ matrix.react }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['22.12', '24']
        react: ['18', '19']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: ${{ matrix.node }}

      # Until @qubeejs/core 1.3.0 is on npm, the devDependency is `file:../qubeejs-core`.
      - name: Build @qubeejs/core from develop
        run: |
          git clone --depth 1 --branch develop https://github.com/AndreaAlhena/qubeejs-core.git ../qubeejs-core
          npm ci --prefix ../qubeejs-core
          npm run build --prefix ../qubeejs-core

      - run: npm ci

      - name: Switch to React 18
        if: matrix.react == '18'
        run: npm install --no-save react@18.3 react-dom@18.3 @types/react@18 @types/react-dom@18

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify the published entry points load
        run: |
          node --input-type=module -e "await import('./dist/index.js')"
          node --input-type=commonjs -e "require('./dist/index.cjs')"

      - name: Verify server/client boundaries are left to @qubeejs/next
        run: |
          if grep -q "use client" dist/index.js dist/index.cjs; then echo "unexpected 'use client' directive"; exit 1; fi
          if grep -qE "from ['\"]next|require\(['\"]next" dist/index.js dist/index.cjs; then echo "unexpected next import"; exit 1; fi

      - name: Verify the package has no runtime dependencies
        run: |
          node -e "
            const { dependencies = {} } = require('./package.json');
            const names = Object.keys(dependencies);
            if (names.length) throw new Error('unexpected runtime dependencies: ' + names.join(', '));
          "
